<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - HBO MAX</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="logo-center">HBO MAX</h1>
            <h2 class="auth-title">登入您的帳號</h2>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required class="form-input">
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" required class="form-input">
                </div>
                <div id="errorMsg" class="error-msg"></div>
                <button type="submit" class="btn btn-primary btn-full">登入</button>
            </form>
            <p class="auth-footer">
                還沒有帳號？<a href="register.html">立即註冊</a>
            </p>
            <p class="auth-footer">
                <a href="index.html">返回首頁</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const result = await login(email, password);
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = result.message || '登入失敗';
                }
            } catch (error) {
                errorMsg.textContent = '登入時發生錯誤';
            }
        });
    </script>
</body>

</html>
