<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - HBO MAX</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="logo-center">HBO MAX</h1>
            <h2 class="auth-title">建立新帳號</h2>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">使用者名稱</label>
                    <input type="text" id="username" name="username" required class="form-input" minlength="3">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required class="form-input">
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" required class="form-input" minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">確認密碼</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required class="form-input">
                </div>
                <div id="errorMsg" class="error-msg"></div>
                <button type="submit" class="btn btn-primary btn-full">註冊</button>
            </form>
            <p class="auth-footer">
                已有帳號？<a href="login.html">立即登入</a>
            </p>
            <p class="auth-footer">
                <a href="index.html">返回首頁</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            if (password !== confirmPassword) {
                errorMsg.textContent = '密碼不一致';
                return;
            }

            try {
                const result = await register(username, email, password);
                if (result.success) {
                    alert('註冊成功！');
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = result.message || '註冊失敗';
                }
            } catch (error) {
                errorMsg.textContent = '註冊時發生錯誤';
            }
        });
    </script>
</body>

</html>
