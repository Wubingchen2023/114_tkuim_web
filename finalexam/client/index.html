<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBO MAX - 影音串流平台</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="nav">
                <h1 class="logo">HBO MAX</h1>
                <nav class="nav-menu">
                    <a href="index.html" class="nav-link active">首頁</a>
                    <a href="favorites.html" class="nav-link" id="favoritesLink">我的收藏</a>
                    <a href="playlists.html" class="nav-link" id="playlistsLink">播放清單</a>
                </nav>
                <div class="user-menu" id="userMenu">
                    <button class="btn btn-primary" id="loginBtn">登入</button>
                    <button class="btn btn-secondary" id="registerBtn">註冊</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2 class="hero-title">探索無限精彩內容</h2>
            <p class="hero-subtitle">HBO MAX 為您帶來最優質的影視作品</p>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜尋影片、導演、演員..." class="search-input">
                <button id="searchBtn" class="btn btn-primary">搜尋</button>
            </div>
        </div>
    </section>

    <!-- Category Filter -->
    <section class="category-section">
        <div class="container">
            <div class="category-filters">
                <button class="category-btn active" data-category="all">全部</button>
                <button class="category-btn" data-category="action">動作</button>
                <button class="category-btn" data-category="drama">劇情</button>
                <button class="category-btn" data-category="comedy">喜劇</button>
                <button class="category-btn" data-category="sci-fi">科幻</button>
                <button class="category-btn" data-category="horror">恐怖</button>
                <button class="category-btn" data-category="animation">動畫</button>
                <button class="category-btn" data-category="superhero">超級英雄</button>
            </div>
        </div>
    </section>

    <!-- Videos Grid -->
    <section class="videos-section">
        <div class="container">
            <div id="videosGrid" class="videos-grid">
                <!-- Videos will be loaded here -->
                <div class="loading">載入中...</div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 HBO MAX. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/video.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
