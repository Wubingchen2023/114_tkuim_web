version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: hbomax-mongodb
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: hbomax_platform
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - hbomax-network

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hbomax-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/hbomax_platform
      - JWT_SECRET=hbomax_secret_key_change_in_production
      - JWT_EXPIRE=7d
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - hbomax-network
    volumes:
      - ./server:/app
      - /app/node_modules

  # Frontend Client (Nginx)
  frontend:
    image: nginx:alpine
    container_name: hbomax-frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - hbomax-network

networks:
  hbomax-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
